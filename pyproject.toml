[project]
name = "dgeom"
version = "0.1.0"
description = "Do diffusion models learn geometry? Score-based manifold learning and uniform sampling on S^3 and a Klein bottle."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgeom"]

# ----------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "experiments"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "D",         # docstrings
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "N",         # pep8-naming
]
ignore = [
    # Mathematical notation is the point of this codebase: J is a Jacobian, P a
    # projection, M a manifold, U/V chart grids. Renaming them to lowercase would
    # make the code harder to check against the paper, not easier.
    "N806",   # uppercase local variable
    "N803",   # uppercase argument
    "D107",   # __init__ docstring -- the class docstring covers it
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on the first line)
    "B008",   # function call in default argument (torch dtypes)
    "SIM108", # ternary is not always more readable
]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["D103", "E402"]   # scripts: main() is self-evident; sys.path
                                     # must be set before the dgeom imports
"src/dgeom/**/__init__.py" = ["F401"] # re-exports are the point of a package init

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dgeom"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
